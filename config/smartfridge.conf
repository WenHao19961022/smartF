# Smart Fridge Configuration File
# This file contains all configurable parameters for the Smart Fridge system

# =====================
# MQTT Configuration
# =====================
mqtt.broker_addr = tcp://101.34.239.30:1883
mqtt.client_id = SmartFridge_MQTT_Client
mqtt.username = admin
mqtt.password = public
mqtt.topic = smartfridge/data
mqtt.qos = 1
mqtt.keepalive = 60

# =====================
# Serial Port Configuration
# =====================
serial.port = /dev/ttyTHS0
serial.baudrate = 115200
serial.timeout_ms = 1000
serial.weight_threshold = 100
serial.temperature_threshold = 1
serial.humidity_threshold = 5

