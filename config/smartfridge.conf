# Smart Fridge Configuration File
# This file contains all configurable parameters for the Smart Fridge system

# =====================
# MQTT Configuration
# =====================
mqtt.broker_addr = tcp://101.34.239.30:1883
mqtt.client_id = SmartFridge_MQTT_Client
mqtt.username = admin
mqtt.password = public
mqtt.topic = smartfridge/data
mqtt.qos = 1
mqtt.keepalive = 60

# =====================
# Serial Port Configuration
# =====================
serial.port = /dev/ttyTHS0
serial.baudrate = 115200
serial.timeout_ms = 1000
serial.weight_threshold = 100
serial.temperature_threshold = 1
serial.humidity_threshold = 5

# =====================
# Computer Vision Model Configuration
# =====================
cv.model_path = /home/nvidia/ws/smartF/cv_model/yolov8/yolov8s.engine
cv.model_onnx_path = /home/nvidia/ws/smartF/cv_model/yolov8/yolov8s.onnx
cv.conf_threshold = 0.25
cv.nms_threshold = 0.4
cv.min_fruit_box_area_ratio = 0.003
cv.min_fruit_box_side = 36
# Position calibration uses normalized coordinates in the 640x640 model image.
# Measure the centers at the usable fridge area's left/right/top/bottom edges,
# divide the raw model coordinate by 640, then enable calibration.
cv.location_calibration_enable = 0
cv.location_x_min = 0.0
cv.location_x_max = 1.0
cv.location_y_min = 0.0
cv.location_y_max = 1.0
cv.location_flip_x = 0
cv.location_flip_y = 0
cv.rotten_spot_enable = 1
cv.rotten_dark_ratio_threshold = 0.15
cv.rotten_dark_ratio_threshold_orange = 0.18
cv.rotten_dark_ratio_threshold_banana = 0.15
cv.rotten_dark_v_threshold = 80
cv.rotten_dark_s_threshold = 30
cv.rotten_dark_v_threshold_orange = 130
cv.rotten_dark_s_threshold_orange = 30
cv.orange_color_reclass_enable = 1
